<section class="chapter view" id="updates" data-group="updates" data-title="更新情報">
  <header>
    <div class="ch-no">更新情報</div>
    <h2>更新情報</h2>
    <p class="ch-lead">こども家庭庁、福岡県・福岡市・北九州市、研修の主催者などのページを毎朝確認し、新しい資料や日程の変更をここに載せています。ガイドの書き換えが要るものは「反映待ち」と表示し、確かめてからガイドに反映します。</p>
  </header>

  <div class="check-meta" id="check-meta"></div>

  <div class="upd-tools">
    <div class="chips" id="upd-chips" role="group" aria-label="発表元"></div>
    <label for="upd-todo"><input type="checkbox" id="upd-todo" autocomplete="off">反映待ちのものだけ</label>
  </div>
  <ol class="upd" id="upd-list"></ol>

  <details class="more" id="watch">
    <summary><span class="st">毎朝確認しているページ</span><small id="watch-count"></small></summary>
    <div class="more-in">
      <ul class="watch" id="watch-list"></ul>
    </div>
  </details>
</section>
