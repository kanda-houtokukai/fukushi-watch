<svg class="v-sp" viewBox="0 0 360 600" role="img" aria-label="事業所と法人本部のあいだの受け渡しを、採用・異動、対象者の範囲、気づき・相談、確認記録、研修の5段で示した図。番号は漏れやすい5か所">
        <defs>
          <marker id="bt-ahs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="f-ink3"/></marker>
        </defs>
        <text x="8" y="16" font-size="12.5" class="tb">事業所</text>
        <text x="202" y="16" font-size="12.5" class="tb tai">法人本部</text>

        <text x="8" y="42" font-size="10.5" class="t3 t-mono">1 採用・異動</text>
        <rect x="8" y="48" width="150" height="70" rx="5" class="f-s2"/>
        <text x="16" y="68" font-size="11.5" class="tb">採用・異動を決める</text>
        <text x="16" y="87" font-size="10.5" class="t2">確認済みを見てから</text>
        <text x="16" y="103" font-size="10.5" class="t2">業務に就かせる</text>
        <rect x="202" y="48" width="150" height="70" rx="5" class="f-aisoft"/>
        <text x="210" y="68" font-size="11.5" class="tb">確認の状況を管理する</text>
        <text x="210" y="87" font-size="10.5" class="t2">業務に就く日までに</text>
        <text x="210" y="103" font-size="10.5" class="t2">確認を終えたかを見る</text>
        <line x1="160" y1="66" x2="198" y2="66" class="s-ink2" stroke-width="1.3" marker-end="url(#bt-ahs)"/>
        <line x1="198" y1="102" x2="162" y2="102" class="s-ink2" stroke-width="1.3" marker-end="url(#bt-ahs)"/>
        <circle cx="180" cy="84" r="9.5" class="f-kin"/><text x="180" y="88" font-size="11" text-anchor="middle" class="tb tinv">1</text>

        <text x="8" y="154" font-size="10.5" class="t3 t-mono">2 対象者の範囲</text>
        <rect x="8" y="160" width="150" height="70" rx="5" class="f-s2"/>
        <text x="16" y="180" font-size="11.5" class="tb">同じ基準で</text>
        <text x="16" y="199" font-size="10.5" class="t2">対象者を名簿にする</text>
        <rect x="202" y="160" width="150" height="70" rx="5" class="f-aisoft"/>
        <text x="210" y="180" font-size="11.5" class="tb">範囲を法人で決める</text>
        <text x="210" y="199" font-size="10.5" class="t2">運転手・調理員などは</text>
        <text x="210" y="215" font-size="10.5" class="t2">3要件で判断</text>
        <line x1="198" y1="195" x2="162" y2="195" class="s-ink2" stroke-width="1.3" marker-end="url(#bt-ahs)"/>
        <circle cx="180" cy="174" r="9.5" class="f-kin"/><text x="180" y="178" font-size="11" text-anchor="middle" class="tb tinv">2</text>

        <text x="8" y="266" font-size="10.5" class="t3 t-mono">3 気づき・相談</text>
        <rect x="8" y="272" width="150" height="70" rx="5" class="f-s2"/>
        <text x="16" y="292" font-size="11.5" class="tb">見守り・相談で気づく</text>
        <text x="16" y="311" font-size="10.5" class="t2">初動の調査と</text>
        <text x="16" y="327" font-size="10.5" class="t2">当面の保護</text>
        <rect x="202" y="272" width="150" height="70" rx="5" class="f-aisoft"/>
        <text x="210" y="292" font-size="11.5" class="tb">対応を検討する</text>
        <text x="210" y="311" font-size="10.5" class="t2">他の事業所も含めて</text>
        <text x="210" y="327" font-size="10.5" class="t2">再発を防ぐ</text>
        <line x1="160" y1="307" x2="198" y2="307" class="s-ink2" stroke-width="1.3" marker-end="url(#bt-ahs)"/>
        <circle cx="180" cy="286" r="9.5" class="f-kin"/><text x="180" y="290" font-size="11" text-anchor="middle" class="tb tinv">3</text>

        <text x="8" y="378" font-size="10.5" class="t3 t-mono">4 確認記録</text>
        <rect x="8" y="384" width="150" height="70" rx="5" class="f-s2"/>
        <text x="16" y="404" font-size="11.5" class="tb">必要な範囲で受け取る</text>
        <text x="16" y="423" font-size="10.5" class="t2">事業所どうしでは</text>
        <text x="16" y="439" font-size="10.5" class="t2">直接渡さない</text>
        <rect x="202" y="384" width="150" height="70" rx="5" class="f-aisoft"/>
        <text x="210" y="404" font-size="11.5" class="tb">確認記録を管理する</text>
        <text x="210" y="423" font-size="10.5" class="t2">責任者は法人単位</text>
        <text x="210" y="439" font-size="10.5" class="t2">権限は異動ごとに設定</text>
        <line x1="198" y1="419" x2="162" y2="419" class="s-ink2" stroke-width="1.3" marker-end="url(#bt-ahs)"/>
        <circle cx="180" cy="398" r="9.5" class="f-kin"/><text x="180" y="402" font-size="11" text-anchor="middle" class="tb tinv">4</text>

        <text x="8" y="490" font-size="10.5" class="t3 t-mono">5 研修</text>
        <rect x="8" y="496" width="150" height="70" rx="5" class="f-s2"/>
        <text x="16" y="516" font-size="11.5" class="tb">研修を受ける</text>
        <text x="16" y="535" font-size="10.5" class="t2">事業所・本部・外部の</text>
        <text x="16" y="551" font-size="10.5" class="t2">どこで受けてもよい</text>
        <rect x="202" y="496" width="150" height="70" rx="5" class="f-aisoft"/>
        <text x="210" y="516" font-size="11.5" class="tb">受講したことを</text>
        <text x="210" y="535" font-size="10.5" class="t2">法人として確認する</text>
        <line x1="160" y1="531" x2="198" y2="531" class="s-ink2" stroke-width="1.3" marker-end="url(#bt-ahs)"/>
        <circle cx="180" cy="510" r="9.5" class="f-kin"/><text x="180" y="514" font-size="11" text-anchor="middle" class="tb tinv">5</text>
        <text x="8" y="592" font-size="10" class="t3">番号の付いた矢印が受け渡し（漏れやすい所）</text>
      </svg>