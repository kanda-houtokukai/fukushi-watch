<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>案B: 要約が主役</title>
<link rel="stylesheet" href="common.css">
<style>
  /* 案B: 主従の逆転。行政の原題(「〜について掲載しました」)は情報量がないため、
     AIの要約を見出しとして大きく組み、原題は小さな出典行に降ろす */
  .b-hi{padding:26px 0;border-bottom:1px solid var(--rule)}
  .b-hi .lead{font-size:18px;line-height:1.65;font-weight:600;color:var(--ink)}
  .b-mid .lead{font-size:14.5px;line-height:1.7;font-weight:500;color:#3a3733}
  .b-mid{padding:15px 0;border-bottom:1px solid var(--rule)}
  .b-orig{font-size:11.5px;color:var(--faint);margin-top:8px;line-height:1.6}
  .b-orig a{color:var(--faint)}
  .b-hi .meta,.b-mid .meta{margin-top:4px}
  .b-low{padding:7px 0;border-bottom:1px solid #f0eee9;font-size:12px;color:#8a867f;line-height:1.6}
  .b-low a{color:#8a867f}
  .sec-h{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--sub);
    padding:26px 0 6px;border-bottom:1px solid var(--rule)}
  .sec-h.hi{color:var(--high);font-size:13px}
</style>
</head>
<body>
<div id="shell"></div>
<script src="data.js"></script>
<script src="shared.js"></script>
<script>
renderShell("案B: 要約が主役");
const { items } = window.MOCK;
const esc = window.mockEsc;
const hi = items.filter(i=>i.imp==="高"), mid = items.filter(i=>i.imp==="中"), low = items.filter(i=>i.imp==="低");
const block = (it, cls) => `
  <article class="it ${cls}" data-fields="${it.fields.join(",")}">
    <div class="lead">${esc(it.sum)}</div>
    <div class="meta">${window.srcMark(it)} ・ ${esc(it.date)}${window.fieldTags(it)}</div>
    <div class="b-orig">原題: <a href="#">${esc(it.title)}</a>　<a href="#" style="color:var(--link)">原本を確認する →</a></div>
  </article>`;
document.getElementById("list").innerHTML = `
  <div class="sec-h hi">◆ 高 ── 対応・確認を</div>
  ${hi.map(it=>block(it,"b-hi")).join("")}
  <div class="sec-h">◇ 中 ── 把握を</div>
  ${mid.map(it=>block(it,"b-mid")).join("")}
  <div class="sec-h">◊ 低 ── 参考</div>
  ${low.map(it=>`
  <div class="it b-low" data-fields="${it.fields.join(",")}">・<a href="#">${esc(it.title)}</a> <span style="color:#b5b1aa">${window.srcMark(it)}</span></div>`).join("")}
`;
</script>
</body>
</html>
