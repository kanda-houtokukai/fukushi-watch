<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>案A: 見出しの階層</title>
<link rel="stylesheet" href="common.css">
<style>
  /* 案A: 文字サイズと余白の階層化。タイトルが主役のまま、高⇔低の落差を最大化する */
  .a-hi{padding:26px 0;border-bottom:1px solid var(--rule)}
  .a-hi h3{font-size:20px;line-height:1.5;font-weight:700}
  .a-hi h3 a{color:var(--ink);text-decoration:none}
  .a-hi .sum{font-size:14px;color:#4c4842;margin-top:10px;line-height:1.8}
  .a-hi .meta{margin-top:6px}
  .a-hi .orig{display:inline-block;font-size:13px;color:var(--link);text-decoration:none;margin-top:10px}
  .a-mid{padding:14px 0;border-bottom:1px solid var(--rule)}
  .a-mid h3{font-size:15px;line-height:1.55;font-weight:600}
  .a-mid h3 a{color:var(--ink);text-decoration:none}
  .a-mid .sum{font-size:12.5px;color:#5c5852;margin-top:5px}
  .a-mid .meta{margin-top:3px}
  .a-low{padding:7px 0;border-bottom:1px solid #f0eee9;font-size:12px;color:#8a867f;line-height:1.6}
  .a-low a{color:#8a867f}
  .sec-h{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--sub);
    padding:26px 0 6px;border-bottom:1px solid var(--rule)}
  .sec-h.hi{color:var(--high);font-size:13px}
</style>
</head>
<body>
<div id="shell"></div>
<script src="data.js"></script>
<script src="shared.js"></script>
<script>
renderShell("案A: 見出しの階層");
const { items } = window.MOCK;
const esc = window.mockEsc;
const hi = items.filter(i=>i.imp==="高"), mid = items.filter(i=>i.imp==="中"), low = items.filter(i=>i.imp==="低");
document.getElementById("list").innerHTML = `
  <div class="sec-h hi">◆ 高 ── 対応・確認を</div>
  ${hi.map(it=>`
  <article class="it a-hi" data-fields="${it.fields.join(",")}">
    <h3><a href="#">${esc(it.title)}</a></h3>
    <div class="sum">${esc(it.sum)}</div>
    <div class="meta">${window.srcMark(it)} ・ ${esc(it.date)}${window.fieldTags(it)}</div>
    <a class="orig" href="#">原本を確認する →</a>
  </article>`).join("")}
  <div class="sec-h">◇ 中 ── 把握を</div>
  ${mid.map(it=>`
  <article class="it a-mid" data-fields="${it.fields.join(",")}">
    <h3><a href="#">${esc(it.title)}</a></h3>
    <div class="sum">${esc(it.sum)}</div>
    <div class="meta">${window.srcMark(it)} ・ ${esc(it.date)}${window.fieldTags(it)}</div>
  </article>`).join("")}
  <div class="sec-h">◊ 低 ── 参考</div>
  ${low.map(it=>`
  <div class="it a-low" data-fields="${it.fields.join(",")}">・<a href="#">${esc(it.title)}</a> <span style="color:#b5b1aa">${window.srcMark(it)}</span></div>`).join("")}
`;
</script>
</body>
</html>
