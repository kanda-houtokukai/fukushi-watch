# 福祉情報ウォッチ — 過去分の遡及記録（手動実行のみ・2026-11-02）
#
# backfill.js は判定に Gemini を使うため、鍵（GitHub Secrets）のあるここで動かす。
# 中身は台帳の手順どおり: backfill.js（--ignore-progress）→ relink.js → data/ をコミット。
# ⚠️メールは送らない・締切は抽出しない・state.json は書かない（backfill.js の設計）。
# ⚠️「書き込む」を外して動かすと、下見（判定なし・書き込みなし）だけで終わる。先に下見で件数を確かめる。
# ⚠️毎朝の daily と同じ並び（concurrency）に入れて、同時に data/ を書かないようにする。

name: backfill

on:
  workflow_dispatch:
    inputs:
      from:
        description: "開始日（YYYY-MM-DD）"
        required: true
        default: "2026-07-01"
      to:
        description: "終了日（YYYY-MM-DD）"
        required: true
        default: "2026-08-20"
      apply:
        description: "書き込む（外すと下見だけ）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: 日付の形を確かめる
        env:
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: |
          [[ "$FROM" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ && "$TO" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "日付は YYYY-MM-DD で" >&2; exit 1; }

      - name: 下見（判定なし・書き込みなし）
        env:
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: node scripts/backfill.js --from "$FROM" --to "$TO" --ignore-progress --dry-run

      - name: 遡及記録
        if: ${{ inputs.apply }}
        env:
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/backfill.js --from "$FROM" --to "$TO" --ignore-progress

      - name: 関連記録の付け直し
        if: ${{ inputs.apply }}
        run: node scripts/relink.js

      - name: コミット
        if: ${{ inputs.apply }}
        env:
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: |
          git config user.name "fukushi-watch"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && { echo "変化なし"; exit 0; }
          git commit -m "遡及: ${FROM}〜${TO} [auto]"
          for i in 1 2 3 4 5; do
            if git pull --rebase --quiet origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 15))
          done
          echo "push できませんでした（5回）" >&2
          exit 1
