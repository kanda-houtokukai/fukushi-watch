# 福祉情報ウォッチ — 毎朝の自動巡回（P3）
#
# 巡回 → 差分検知 → 要約・重要度判定 → メール送信 → 履歴 → 締切 → 助成金 → 状態のコミット
#
# ⚠️ 状態のコミットはメール送信の「後」に置く。
#    送信に失敗した日は状態が更新されないため、翌日の実行で同じ新着を
#    もう一度検知して再送する（＝失敗しても取りこぼさない）。

name: daily

on:
  schedule:
    # ⚠️ cron は UTC 指定（JST = UTC+9）。分は正時（0分）を避ける——正時は最も混み、
    #    その回が丸ごと破棄されることがある（2026-08-27に実際に発生）。分を 23 に置く。
    #    ⚠️ Actions の cron はそもそも定刻に起きない。実測（到着5日分）で発火は指定から
    #    2〜3時間ほど遅れた。時刻は「その頃までに動いていればよい」余裕を見て選ぶこと。
    #
    # 深夜に寄せた理由（P56②）: 行政の発表は日中に出る。未明に巡回しておけば、利用者が
    #    出勤する朝までには前日ぶんが反映済みになる。1本目 JST 02:23 / 2本目 JST 08:23 の6時間差。
    - cron: "23 17 * * *"   # UTC 17:23 = JST 02:23（1本目・本命）
    # ⚠️保険の2本目（JST 08:23）。1本目が丸ごと飛んだ日を自力で回収するため（P49）。
    #    2026-08-27・28 と2日続けて1本目が不発だった（8/27は GitHub の Actions 障害——
    #    critical 00:11〜03:01。P42で「正時の混雑」と診断したのは誤りだった）。
    #    ⚠️2本目は二重に黙る（対外に説明した「毎朝1回のみ」を実装で守る・P56①）:
    #      ① 巡回 … その日の巡回が既に成功していれば crawl.js が取得自体をスキップする
    #        （data/state.json の lastCrawlDate を見る＝外部サイトを1日2回叩かない）。
    #      ② 送信 … 同じ日に送信済みなら notify.js が送らない（lastSentDate）。
    #    ⚠️どちらの記録も全処理の後に書くので、途中で失敗した日は残らず、2本目が取得から
    #    やり直す（＝失敗しても取りこぼさない・P3/P49の順序の設計）。
    - cron: "23 23 * * *"   # UTC 23:23 = JST 08:23（保険）
  workflow_dispatch: {} # 手動実行（検証用）

permissions:
  contents: write # data/*.json をコミットして push するために必要

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: 巡回と差分検知
        run: node scripts/crawl.js

      - name: 要約と重要度判定
        run: node scripts/summarize.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: メール送信
        run: node scripts/notify.js
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

      - name: 履歴に記録
        run: node scripts/archive.js

      - name: 締切の抽出
        run: node scripts/deadlines.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # 助成金は紙面とは別系統（data/grants.json のみを書く・P24）。
      # メール・履歴・締切には一切触れないので、ここで失敗しても本体は完了している。
      - name: 助成金の収集
        run: node scripts/grants.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # 研修も紙面とは別系統（data/kenshu.json のみを書く・P34）。
      # 締切・タグは機械抽出。⚠️「開催の要点」だけは規則で取れないPDF（番号付きの
      # 開催要綱）に限りAIを使う（P48）。AIの値は原文と機械照合してから採る。
      # 鍵が無くても巡回は止まらない（規則方式だけで続行する）。
      - name: 研修の収集
        run: node scripts/kenshu.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: 状態をコミット
        run: |
          git config user.name "fukushi-watch"
          git config user.email "actions@users.noreply.github.com"
          N=$(node -p "require('./data/diff-latest.json').newItems.length")
          git add data/
          git diff --cached --quiet || { git commit -m "巡回: 新規${N}件 [auto]"; git push; }
